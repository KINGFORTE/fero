<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Landing Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preload" as="image" href="images/candidate1.png" fetchpriority="high">
    <link rel="preload" as="image" href="images/candidate2.png" fetchpriority="high">
</head>
<body class="home">
<header>
    <h1>Figma Landing Page</h1>
</header>

<div class="grid-container">
    <!-- Presidential Candidates -->
    <div class="grid-item">
        <h3>Presidential Candidates</h3>
        <img src="images/candidate1.png" alt="Candidate 1" width="139" height="121" decoding="async" fetchpriority="high">
        <img src="images/candidate2.png" alt="Candidate 2" width="139" height="121" decoding="async" fetchpriority="high">
    </div>

    <!-- Voter Instructions -->
    <div class="grid-item">
        <h3>Voter Instructions</h3>
        <p>Step 1: Register.</p>
        <p>Step 2: Vote responsibly.</p>
    </div>

    <!-- Video Page -->
    <div class="grid-item">
        <h3>Video Page</h3>
        <img src="images/video-thumbnail.png" alt="Video Thumbnail" width="268" height="144" decoding="async" loading="lazy">
        <p>Watch now</p>
    </div>

    <!-- Nigerian Shorts -->
    <div class="grid-item">
        <h3>Nigerian Shorts</h3>
        <img src="images/short2.png" alt="Short" width="139" height="121" decoding="async" loading="lazy">
    </div>

    <!-- Advertisement -->
    <div class="advertisement">
        <h3>Advertise Here</h3>
        <p>Your ad could be here!</p>
        <button>Contact Us</button>
    </div>
</div>

<footer>
    <p>&copy; 2023 Figma Landing Page</p>
</footer>
</body>
</html>
